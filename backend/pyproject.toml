[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends()/Query() como defaults es el patrón oficial de FastAPI
    "E501",  # líneas largas en comentarios/strings; el formatter gestiona el código
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/", "alembic/", "__init__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: tests unitarios sin I/O ni dependencias externas",
    "integration: tests que combinan dos o más módulos reales",
    "e2e: tests de flujo completo de extremo a extremo",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
