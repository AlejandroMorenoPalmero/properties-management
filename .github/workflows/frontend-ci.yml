name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-ci.yml"
      - ".nvmrc"
      - ".pre-commit-config.yaml"
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/frontend-ci.yml"
      - ".nvmrc"
      - ".pre-commit-config.yaml"
      - "frontend/**"

jobs:
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm exec prettier --check "src/**/*.{ts,html,scss}"

      - name: Test
        run: pnpm test:ci

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
