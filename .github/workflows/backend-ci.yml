name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".pre-commit-config.yaml"
      - "backend/**"
      - "docker-compose.test.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".pre-commit-config.yaml"
      - "backend/**"
      - "docker-compose.test.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Ruff
        run: pip install ruff==0.15.13
      - name: Check lint
        run: ruff check .
      - name: Check format
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt mypy==2.1.0
      - name: Run mypy
        run: >
          python -m mypy
          api/ application/ domain/ infrastructure/ config.py main.py
          --config-file pyproject.toml
          --explicit-package-bases

  test:
    name: Tests & Coverage (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rentals_test
          MYSQL_USER: rentals
          MYSQL_PASSWORD: rentals_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_USER: rentals
      DB_PASS: rentals_pass
      DB_NAME: rentals_test
      DB_PORT: 3306
      RENTALS_IGNORE_ENV_FILE: 1
      DEBUG: false
      JWT_SECRET_KEY: test-ci-secret-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: python -m pytest tests/ --cov --cov-report=term-missing
