<div
  class="booking-bar"
  [class.bar-round-left]="bar().isCheckin"
  [class.bar-round-right]="bar().isCheckout"
  [class.bar-cancelled]="bar().booking.status === 'Cancelled'"
  [style.left.%]="bar().leftPct"
  [style.width.%]="bar().widthPct"
  [style.top.px]="top"
  [style.height.px]="height"
  [style.background]="bar().booking.status === 'Cancelled' ? null : bar().background"
  (click)="barClick.emit(bar().booking)"
  [attr.title]="bar().booking.booking_id + ' — ' + bar().booking.guest_name"
>
  <span class="bar-label">{{ bar().booking.booking_id }} - {{ bar().booking.guest_name }}</span>
</div>
