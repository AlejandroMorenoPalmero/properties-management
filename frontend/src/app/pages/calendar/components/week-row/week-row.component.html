<div class="week-row" [style.height.px]="weekHeight">
  <!-- Gutter izquierdo: número de semana ISO del año -->
  <div class="week-number" title="Semana del año">{{ week().weekNumber }}</div>

  <!-- Cuerpo de la fila: contexto de posicionamiento para grid + barras -->
  <div class="week-body">
    <div class="days-grid">
      @for (day of week().days; track day.date) {
        <div class="day-cell" [class.other-month]="!day.currentMonth" [class.today]="day.isToday">
          <span class="day-number">{{ day.date.getDate() }}</span>
        </div>
      }
    </div>

    <div class="bars-overlay">
      @for (bar of week().bars; track bar.booking.record_id) {
        <app-booking-bar [bar]="bar" (barClick)="barClick.emit($event)" />
      }
    </div>
  </div>
</div>
