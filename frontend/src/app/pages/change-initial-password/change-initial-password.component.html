<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <img src="logo.png" alt="Logo" />
    </div>

    @if (done()) {
      <h1 class="login-title">Contraseña actualizada</h1>
      <p class="recovery-hint">
        Se ha cambiado la contraseña con éxito. Te llevamos a la aplicación…
      </p>
      <button type="button" class="btn-login" (click)="goToApp()">Continuar</button>
    } @else {
      <h1 class="login-title">Nueva contraseña</h1>
      <p class="recovery-hint">
        Estás usando la contraseña inicial. Elige una contraseña propia para continuar.
      </p>

      <form class="login-form" (ngSubmit)="onSubmit()" #changeForm="ngForm">
        <div class="form-group">
          <label for="newPassword">Nueva contraseña</label>
          <input
            id="newPassword"
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            minlength="6"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Repite la contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            placeholder="Repite la contraseña"
            autocomplete="new-password"
          />
        </div>

        @if (errorMsg) {
          <p class="error-msg">{{ errorMsg }}</p>
        }

        <button type="submit" class="btn-login" [disabled]="changeForm.invalid || loading()">
          Cambiar contraseña
        </button>
      </form>
    }
  </div>
</div>
