<div class="searches-page">
  <header class="page-header">
    <h1 class="page-title">Búsquedas</h1>
    <p class="page-subtitle">Consulta pisos, reservas y estadísticas con filtros avanzados</p>
  </header>

  <nav class="tabs-nav">
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'availability'"
      (click)="selectTab('availability')"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="3" y1="10" x2="21" y2="10" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="16" y1="2" x2="16" y2="6" />
      </svg>
      Disponibilidad
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'apartment'"
      (click)="selectTab('apartment')"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 9.5L12 3l9 6.5V21H3V9.5z" />
        <rect x="9" y="14" width="6" height="7" />
      </svg>
      Detalle de piso
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'bookings'"
      (click)="selectTab('bookings')"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
      </svg>
      Búsqueda de reservas
    </button>
  </nav>

  @if (apartmentIdsError()) {
    <p class="page-error">{{ apartmentIdsError() }}</p>
  }

  <app-availability-search
    [hidden]="activeTab() !== 'availability'"
    (apartmentSelected)="openApartmentDetail($event)"
    (bookingCreateRequested)="openCreateBookingModal($event)"
  />

  <app-apartment-search
    [hidden]="activeTab() !== 'apartment'"
    [allApartmentIds]="allApartmentIds()"
    [apartmentToLoad]="apartmentToLoad()"
    (bookingSelected)="openModal($event)"
  />

  <app-booking-search
    [hidden]="activeTab() !== 'bookings'"
    [allApartmentIds]="allApartmentIds()"
    (bookingSelected)="openModal($event)"
  />
</div>

@if (selectedBooking()) {
  <app-booking-modal
    [booking]="selectedBooking()!"
    (close)="closeModal()"
    (saved)="onBookingSaved($event)"
  />
}

@if (createBookingInitialValues()) {
  <app-booking-create-modal
    [apartments]="allApartmentIds()"
    [initialValues]="createBookingInitialValues()"
    (close)="closeCreateBookingModal()"
    (created)="onBookingCreated($event)"
  />
}
