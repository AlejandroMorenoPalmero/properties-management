<form class="change-password-form" (ngSubmit)="onSubmit()" #passwordForm="ngForm">
  <label>
    Contraseña actual
    <input
      type="password"
      name="currentPassword"
      placeholder="Introduce tu contraseña actual"
      autocomplete="current-password"
      [ngModel]="currentPassword()"
      (ngModelChange)="updateCurrentPassword($event)"
      required
    />
  </label>

  <label>
    Nueva contraseña
    <input
      type="password"
      name="newPassword"
      placeholder="Mínimo {{ MIN_PASSWORD_LENGTH }} caracteres"
      autocomplete="new-password"
      [ngModel]="newPassword()"
      (ngModelChange)="updateNewPassword($event)"
      [minlength]="MIN_PASSWORD_LENGTH"
      required
    />
  </label>

  <label>
    Repetir nueva contraseña
    <input
      type="password"
      name="confirmPassword"
      placeholder="Repite la nueva contraseña"
      autocomplete="new-password"
      [ngModel]="confirmPassword()"
      (ngModelChange)="updateConfirmPassword($event)"
      required
    />
  </label>

  @if (errorMsg()) {
    <p class="form-message error" role="alert">{{ errorMsg() }}</p>
  }
  @if (successMsg()) {
    <p class="form-message success" role="status">{{ successMsg() }}</p>
  }

  <div class="form-actions">
    <button class="primary-btn" type="submit" [disabled]="passwordForm.invalid || isSaving()">
      {{ isSaving() ? 'Guardando...' : 'Cambiar contraseña' }}
    </button>
  </div>
</form>
